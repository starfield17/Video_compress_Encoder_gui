name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Architecture, lint, and types
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check module boundaries
        run: python -m unittest discover -s test -p "test_architecture.py" -v

      - name: Lint Python sources
        run: ruff check .

      - name: Type-check core and CLI
        run: pyright

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure project temp directory
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workdir/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify generated icon assets
        run: python scripts/build_icons.py --check

      - name: Compile Python sources
        run: python -m compileall -q main.py cli core gui scripts test

      - name: Check CLI help
        run: python main.py --cli --help

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test_*.py" -v

  packaging-smoke:
    name: Nuitka packaging smoke (${{ matrix.target }})
    needs: [quality, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
            architecture: x64
            msi_architecture: x86_64
            package_kind: standalone
            windows_compiler: msvc

          - os: windows-11-arm
            target: windows-arm64
            architecture: arm64
            msi_architecture: arm64
            package_kind: standalone
            windows_compiler: clang

          - os: ubuntu-22.04
            target: linux-x86_64
            architecture: x64
            package_kind: standalone

          - os: ubuntu-24.04-arm
            target: linux-arm64
            architecture: arm64
            package_kind: standalone

          - os: macos-15-intel
            target: macos-x86_64
            architecture: x64
            target_arch: x86_64
            package_kind: macos-app

          - os: macos-15
            target: macos-arm64
            architecture: arm64
            target_arch: arm64
            package_kind: macos-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Configure project temp directory
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workdir/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify generated icon assets
        run: python scripts/build_icons.py --check

      - name: Diagnose packaging interpreter
        run: python -c "import platform, PySide6; print(platform.platform()); print(platform.machine()); print(PySide6.__version__)"

      - name: Build Windows standalone package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python .\scripts\build_nuitka.py `
            --clean `
            --version 0.0.0 `
            --windows-compiler "${{ matrix.windows_compiler }}"

      - name: Build Linux standalone package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/build_nuitka.py \
            --clean \
            --version 0.0.0

      - name: Build macOS app bundle
        if: runner.os == 'macOS' && matrix.package_kind == 'macos-app'
        shell: bash
        run: |
          python scripts/build_nuitka.py \
            --clean \
            --version 0.0.0 \
            --macos-app-bundle \
            --target-arch "${{ matrix.target_arch }}"

      - name: Verify packaged executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = ".\dist\video-compressor\video-compressor.exe"

          if (-not (Test-Path $executable)) {
              throw "Packaged executable not found: $executable"
          }

          & $executable --cli --help

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Install pinned WiX Toolset for MSI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install `
            --tool-path ".\workdir\wix-tool" `
            wix `
            --version 6.0.2

      - name: Build and inspect Windows MSI smoke package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = ".\workdir\msi-smoke-source"
          $ffmpeg = Join-Path $source "FFmpeg\bin"
          New-Item -ItemType Directory -Force -Path $ffmpeg | Out-Null
          Copy-Item ".\dist\video-compressor\video-compressor.exe" $source
          Set-Content -Path (Join-Path $ffmpeg "ffmpeg.exe") -Value "smoke"
          Set-Content -Path (Join-Path $ffmpeg "ffprobe.exe") -Value "smoke"

          $msi = ".\workdir\video-compressor-smoke-${{ matrix.target }}.msi"
          python .\scripts\build_msi.py `
            --version "0.0.0" `
            --architecture "${{ matrix.msi_architecture }}" `
            --source-dir $source `
            --output $msi `
            --wix ".\workdir\wix-tool\wix.exe"

          $expanded = Join-Path $env:GITHUB_WORKSPACE "workdir\msi-smoke-expanded"
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          $resolvedMsi = (Resolve-Path $msi).Path
          $process = Start-Process msiexec.exe `
            -Wait `
            -PassThru `
            -ArgumentList @("/a", "`"$resolvedMsi`"", "/qn", "TARGETDIR=`"$expanded`"")
          if ($process.ExitCode -ne 0) {
              throw "MSI smoke extraction failed with exit code $($process.ExitCode)"
          }
          foreach ($name in @("video-compressor.exe", "ffmpeg.exe", "ffprobe.exe")) {
              if (-not (Get-ChildItem -Path $expanded -Recurse -File -Filter $name)) {
                  throw "MSI smoke package does not contain $name"
              }
          }

      - name: Verify packaged executable on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f dist/video-compressor/video-compressor
          chmod +x dist/video-compressor/video-compressor
          ./dist/video-compressor/video-compressor --cli --help

      - name: Verify macOS app bundle and DMG
        if: runner.os == 'macOS' && matrix.package_kind == 'macos-app'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          app="dist/Video Compressor.app"
          executable="$app/Contents/MacOS/video-compressor"
          dmg="dist/video-compressor.dmg"

          test -d "$app"
          test -f "$app/Contents/Info.plist"
          test -x "$executable"
          "$executable" --cli --help
          codesign --verify --deep --strict "$app"
          file "$executable"

          archs="$(lipo -archs "$executable")"
          if [[ "$archs" != "$TARGET_ARCH" ]]; then
              printf 'Expected native %s executable, found %s\n' "$TARGET_ARCH" "$archs" >&2
              exit 1
          fi

          test -f "$dmg"
          hdiutil verify "$dmg"

      - name: Upload Nuitka compilation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuitka-report-${{ matrix.target }}
          path: build/reports/**
          include-hidden-files: true
          if-no-files-found: warn
