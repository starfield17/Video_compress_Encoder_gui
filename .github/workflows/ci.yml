name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      has_tests: ${{ steps.plan.outputs.has_tests }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      run_installer_contract: ${{ steps.plan.outputs.run_installer_contract }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
      package_mode: ${{ steps.plan.outputs.package_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute verification plan
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
          else
              base="${{ github.event.before }}"
          fi
          echo "base=$base"
          echo "head=$GITHUB_SHA"

          # Fail closed: an unknown or invalid base runs the full plan.
          if [ -z "$base" ] || \
             [ "$base" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              python3 scripts/ci_plan.py
              exit $?
          fi

          changed_file="$RUNNER_TEMP/changed-files"
          if ! git diff --name-only -z "$base" "$GITHUB_SHA" > "$changed_file"; then
              # Fail closed: a diff failure must never downgrade verification.
              python3 scripts/ci_plan.py
              exit $?
          fi

          mapfile -d '' changed < "$changed_file"
          python3 scripts/ci_plan.py "${changed[@]}"

  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml

  tests:
    name: Tests
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}

  installer:
    name: Windows Installer Contract
    needs: plan
    if: needs.plan.outputs.run_installer_contract == 'true'
    uses: ./.github/workflows/_windows-installer-contract.yml

  packages:
    name: Packages
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    uses: ./.github/workflows/_package.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      package_kind: ${{ matrix.package_kind }}
      windows_compiler: ${{ matrix.windows_compiler }}
      installer_architecture: ${{ matrix.installer_architecture }}
      target_arch: ${{ matrix.target_arch }}
      mode: ${{ needs.plan.outputs.package_mode }}

  gate:
    name: CI Gate
    needs: [plan, quality, tests, installer, packages]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Assert CI Gate is the required branch protection status
        run: echo "CI Gate is the single gate; it validates every selected job."

      - name: Check planner contract wiring
        shell: bash
        run: |
          if [ "${{ needs.plan.outputs.has_tests }}" = "true" ]; then
              [ "${{ needs.tests.result }}" != "skipped" ] || exit 1
          fi
          if [ "${{ needs.plan.outputs.run_installer_contract }}" = "true" ]; then
              [ "${{ needs.installer.result }}" != "skipped" ] || exit 1
          fi
          if [ "${{ needs.plan.outputs.has_packages }}" = "true" ]; then
              [ "${{ needs.packages.result }}" != "skipped" ] || exit 1
          fi

      - name: Fail if any required job failed or was cancelled
        shell: bash
        run: |
          statuses=(
            "${{ needs.quality.result }}"
            "${{ needs.tests.result }}"
            "${{ needs.installer.result }}"
            "${{ needs.packages.result }}"
          )
          for status in "${statuses[@]}"; do
              if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
                  echo "A required job failed: $status" >&2
                  exit 1
              fi
          done
          exit 0
